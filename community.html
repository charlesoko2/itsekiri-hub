<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community • Ẹ̀dẹ Itsekiri</title>
    <meta name="description" content="A private space for the Iwere family." />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <header class="hero hero-small">
      <div class="hero-content">
        <h1 class="main-title">Itsekiri Community</h1>
        <p class="subtitle">A private space for the Iwere family</p>
      </div>
    </header>

    <section class="section" id="authSection">
      <div class="container">
        <div class="form-container narrow">
          <h2>Member Login</h2>
          <form id="loginForm">
            <input type="email" placeholder="Email" aria-label="Email" required />
            <input type="password" placeholder="Password" aria-label="Password" required />
            <button type="submit" class="btn-primary">Log In</button>
          </form>
          <p id="authMessage" class="form-message"></p>
          <p class="text-center" style="margin-top: 20px">
            New member? <a href="index.html#community" class="gold">Register here</a>
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container text-center">
        <h2>What’s Coming</h2>
        <div class="grid-3">
          <div class="card"><h3>Discussions</h3><p>Share and learn with Itsekiri people everywhere.</p></div>
          <div class="card"><h3>Events</h3><p>Festivals, meetups and language classes.</p></div>
          <div class="card"><h3>Members</h3><p>Find family and friends by community and location.</p></div>
        </div>
      </div>
    </section>

    <div id="site-footer"></div>
    <script src="js/layout.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
