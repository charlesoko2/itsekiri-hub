<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary • Ẹ̀dẹ Itsekiri</title>
    <meta name="description" content="Search Itsekiri ↔ English words and phrases." />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <header class="hero hero-small">
      <div class="hero-content">
        <h1 class="main-title">Itsekiri Dictionary</h1>
        <p class="subtitle">Ọmạtẹ Itsekiri ↔ English Translation</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="dict-wrap">
          <label for="searchInput" class="sr-only">Search the dictionary</label>
          <input type="search" id="searchInput" class="dict-input" placeholder="Type an Itsekiri or English word..." autocomplete="off" />
          <p class="dict-hint">Tip: accents and dots are optional — “ese” finds “Ẹ se”.</p>
          <div id="dictionaryResults" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <div id="site-footer"></div>
    <script src="js/layout.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/dictionary-data.js" defer></script>
    <script src="js/dictionary.js" defer></script>
  </body>
</html>
