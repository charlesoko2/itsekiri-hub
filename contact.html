<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact • Ẹ̀dẹ Itsekiri</title>
    <meta name="description" content="Get in touch with the Itsekiri Language & Culture Project." />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-nav"></div>

    <header class="hero hero-small">
      <div class="hero-content">
        <h1 class="main-title">Contact Us</h1>
        <p class="subtitle">Get in touch with the Itsekiri team</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="form-container" style="max-width: 800px">
          <form id="contactForm">
            <div class="form-row">
              <input type="text" placeholder="Your Name" aria-label="Your name" required />
              <input type="email" placeholder="Your Email" aria-label="Your email" required />
            </div>
            <input type="text" placeholder="Subject" aria-label="Subject" required />
            <textarea placeholder="Your Message" aria-label="Your message" rows="8" required></textarea>
            <button type="submit" class="btn-primary">Send Message</button>
          </form>
          <p id="contactMessage" class="form-message"></p>
        </div>
        <div class="text-center" style="margin-top: 60px">
          <p>Email: info@edeitsekiri.org</p>
          <p>Instagram: @edeitsekiri</p>
          <p>Warri, Delta State, Nigeria</p>
        </div>
      </div>
    </section>

    <div id="site-footer"></div>
    <script src="js/layout.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
